<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earnings-kalender — API-drevet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Cg stroke='%23111' stroke-width='7' fill='none' stroke-linecap='square'%3E%3Cpath d='M50 20L20 78'/%3E%3Cpath d='M50 20L80 78'/%3E%3Cpath d='M33 64H55'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfbfa; --paper: #FFFFFF; --ink: #1B2A2E; --ink-soft: #52666B; --line: #DDE3E2;
    --accent: #1D4E4A; --accent-soft: #E4EDEB;
    --pos: #2E6B4F; --pos-bg: #E3EFE8;
    --neg: #A6432E; --neg-bg: #F7E9E4;
    --neu: #8A6A1E; --neu-bg: #F5EEDB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header { border-bottom: 1px solid var(--line); background: var(--paper); padding: 24px 32px; display: flex; justify-content: space-between; align-items: flex-end; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; }
  h1 { font-family: 'Newsreader', serif; font-weight: 500; font-size: 24px; margin: 0; letter-spacing: -0.01em; }
  nav a { font-size: 13px; color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; margin-left: 16px; }
  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  .auto-note { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 8px 14px; margin-bottom: 16px; display: inline-block; }
  .summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (max-width: 700px) { .summary-bar { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { table { display: block; overflow-x: auto; } }
  .summary-card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; text-align: center; }
  .summary-value { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; }
  .summary-label { font-size: 10px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 3px; }
  .search-row { margin-bottom: 16px; }
  .search-row input { width: 100%; font-family: 'IBM Plex Sans', sans-serif; font-size: 13.5px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--ink); }
  .earnings-card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; margin-bottom: 12px; }
  .ec-top { display: flex; justify-content: space-between; align-items: baseline; }
  .ec-company { font-family: 'Newsreader', serif; font-size: 18px; font-weight: 500; }
  .ec-ticker { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
  .ec-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; padding: 3px 9px; border-radius: 3px; font-weight: 600; }
  .badge-beat { background: var(--pos-bg); color: var(--pos); }
  .badge-beat_kvalitativt { background: var(--pos-bg); color: var(--pos); }
  .badge-blandet { background: var(--neu-bg); color: var(--neu); }
  .badge-miss { background: var(--neg-bg); color: var(--neg); }
  .ec-numbers { display: flex; gap: 24px; margin-top: 12px; }
  .ec-stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; color: var(--ink-soft); }
  .ec-stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; margin-top: 2px; }
  .ec-no-data { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); font-style: italic; margin-top: 10px; }
  .ec-note { font-size: 13px; color: var(--ink-soft); margin-top: 10px; line-height: 1.5; }
  .ec-next { font-size: 12px; color: var(--accent); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .loading { font-family: 'Newsreader', serif; font-style: italic; color: var(--ink-soft); padding: 30px 0; text-align: center; }
</style>

<style id="lt-nav-css">
.lt-nav{position:sticky;top:0;z-index:999;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid #e6e5e0;font-family:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif}
.lt-nav__in{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px;height:54px}
.lt-nav__b{display:flex;align-items:center;gap:9px;text-decoration:none;color:#111;flex:none}
.lt-nav__b svg{width:18px;height:18px}
.lt-nav__b svg path,.lt-nav__b svg line{stroke:#111;stroke-width:3.4;fill:none;stroke-linecap:square}
.lt-nav__b b{font-size:10.5px;font-weight:600;letter-spacing:.2em;white-space:nowrap}
.lt-nav__l{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.lt-nav__l::-webkit-scrollbar{display:none}
.lt-nav__l a{font-size:13px;color:#4a4944;text-decoration:none;padding:6px 11px;border-radius:7px;white-space:nowrap}
.lt-nav__l a:hover{background:#f2f1ee;color:#111}
.lt-nav__l a[aria-current]{background:#111;color:#fff;font-weight:500}
@media(max-width:640px){.lt-nav__in{gap:14px;padding:0 16px}.lt-nav__b b{display:none}}
</style>
</head>
<body>
<div class="lt-nav"><div class="lt-nav__in"><a class="lt-nav__b" href="/"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M 50 14 L 15 84"/><path d="M 50 14 L 85 84"/><line x1="30" y1="70" x2="52" y2="70"/></svg><b>LYNGBÆK TECH</b></a><nav class="lt-nav__l"><a href="/">Overblik</a><a href="/aktier.html">Recession</a><a href="/kort.html">Kort</a><a href="/udbud.html">Udbud</a><a href="/earnings.html" aria-current="page">Earnings</a><a href="/nyheder.html">Nyheder</a></nav></div></div>


<header>
  <div>
    <p class="eyebrow">Earnings-kalender</p>
    <h1>Regnskaber — faktisk vs. forventet</h1>
  </div>
</header>

<main>
  <div class="auto-note" id="auto-note">Henter …</div>
  <div class="summary-bar" id="summary-bar"></div>
  <div class="search-row"><input type="text" id="search-input" placeholder="Søg selskab…"></div>
  <div id="earnings-list"><div class="loading">Henter regnskabsdata …</div></div>
</main>

<script>
const BADGE_LABEL = { beat: 'Slog forventning', beat_kvalitativt: 'Slog forventning', blandet: 'Blandet', miss: 'Under forventning' };
let ALL_EARNINGS = [];

function renderEarnings(filterText) {
  const filtered = filterText
    ? ALL_EARNINGS.filter(e => e.selskab.toLowerCase().includes(filterText.toLowerCase()))
    : ALL_EARNINGS;

  const listEl = document.getElementById('earnings-list');
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="loading">Ingen selskaber matcher søgningen.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(e => `
    <div class="earnings-card">
      <div class="ec-top">
        <div>
          <span class="ec-company">${e.selskab}</span>
          <span class="ec-ticker">${e.ticker}</span>
        </div>
        <span class="ec-badge badge-${e.resultat}">${BADGE_LABEL[e.resultat] || e.resultat}</span>
      </div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">Rapporteret ${e.seneste_rapport_dato}</div>

      ${e.detaljer_tilgaengelige ? `
        <div class="ec-numbers">
          ${e.actual_eps_usd !== null ? `<div><div class="ec-stat-label">Faktisk EPS</div><div class="ec-stat-value">$${e.actual_eps_usd}</div></div>` : ''}
          ${e.expected_eps_usd !== null ? `<div><div class="ec-stat-label">Forventet EPS</div><div class="ec-stat-value">$${e.expected_eps_usd}</div></div>` : ''}
          ${e.overraskelse_pct !== null ? `<div><div class="ec-stat-label">Overraskelse</div><div class="ec-stat-value" style="color:${e.overraskelse_pct >= 0 ? 'var(--pos)' : 'var(--neg)'};">${e.overraskelse_pct > 0 ? '+' : ''}${e.overraskelse_pct}%</div></div>` : ''}
        </div>
      ` : (e.expected_eps_usd !== null ? `<div class="ec-numbers"><div><div class="ec-stat-label">Forventet EPS</div><div class="ec-stat-value">$${e.expected_eps_usd}</div></div></div><div class="ec-no-data">Faktisk EPS ikke sammenlignelig — selskabet rapporterer ikke EPS som primært nøgletal</div>` : `<div class="ec-no-data">Præcise EPS-konsensustal ikke verificeret — kun kvalitativ vurdering vist</div>`)}

      <div class="ec-note">${e.note}</div>

      ${e.naeste_rapport_dato ? `<div class="ec-next">Næste rapport: ${e.naeste_rapport_dato}${e.naeste_forventet_eps_usd ? ` · forventet EPS $${e.naeste_forventet_eps_usd}` : ''}</div>` : ''}
    </div>
  `).join('');
}

function renderSummary() {
  const beats = ALL_EARNINGS.filter(e => e.resultat === 'beat' || e.resultat === 'beat_kvalitativt').length;
  const blandet = ALL_EARNINGS.filter(e => e.resultat === 'blandet').length;
  const miss = ALL_EARNINGS.filter(e => e.resultat === 'miss').length;
  const withData = ALL_EARNINGS.filter(e => e.detaljer_tilgaengelige);
  const avgSurprise = withData.length ? withData.reduce((a, e) => a + e.overraskelse_pct, 0) / withData.length : null;

  document.getElementById('summary-bar').innerHTML = `
    <div class="summary-card"><div class="summary-value" style="color:var(--pos);">${beats}</div><div class="summary-label">Slog forventning</div></div>
    <div class="summary-card"><div class="summary-value" style="color:var(--neu);">${blandet}</div><div class="summary-label">Blandet</div></div>
    <div class="summary-card"><div class="summary-value" style="color:var(--neg);">${miss}</div><div class="summary-label">Under forventning</div></div>
    <div class="summary-card"><div class="summary-value">${avgSurprise !== null ? (avgSurprise > 0 ? '+' : '') + avgSurprise.toFixed(1) + '%' : '—'}</div><div class="summary-label">Gns. overraskelse (verificeret)</div></div>
  `;
}

async function load() {
  try {
    const res = await fetch('/api/earnings');
    if (!res.ok) throw new Error(`Serveren svarede med fejl (${res.status})`);
    const { fetchedAt, data } = await res.json();

    document.getElementById('auto-note').textContent =
      `Automatisk opdateringsjob kører hver dag kl. 06:00 (se cron i server.js) — seneste hentning: ${fetchedAt}`;

    ALL_EARNINGS = [...data].sort((a, b) => b.seneste_rapport_dato.localeCompare(a.seneste_rapport_dato));
    renderSummary();
    renderEarnings('');
  } catch (err) {
    document.getElementById('auto-note').textContent = 'Kunne ikke hente data — tjek at serveren kører (node src/server.js)';
    document.getElementById('earnings-list').innerHTML = `<div class="loading">${err.message}</div>`;
  }
}

document.getElementById('search-input').addEventListener('input', e => renderEarnings(e.target.value));

load();
</script>

</body>
</html>
